version: '3.8'

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: repogrowth
    volumes:
      - pgdata:/var/lib/postgresql/data

  consumer_cleaner:
    build: ./consumer_cleaner
    container_name: consumer_cleaner
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: github_repo_stats
      DATABASE_URL: postgresql://user:password@postgres:5432/repogrowth
    restart: on-failure

  producer_github:
    build: ./producer_github
    container_name: producer_github
    depends_on:
      - kafka
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: github_repo_stats

volumes:
  pgdata: